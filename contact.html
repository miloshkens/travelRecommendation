
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Smart Travel - Contact Us</title>
    <style>
        /* Reset and base styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #333;
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        /* Navbar styling */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(227, 242, 253, 0.9); /* soft pastel blue with transparency */
            padding: 15px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            backdrop-filter: saturate(140%) blur(6px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #0077b6;
        }
        .logo img { height: 40px; width: 40px; object-fit: contain; }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a {
            text-decoration: none;
            color: #0077b6;
            font-weight: 500;
            transition: color 0.25s ease;
        }
        .nav-links a:hover { color: #023e8a; }

        /* Contact container */
        .contact-container {
            max-width: 720px;
            margin: 100px 30px 40px 30px; /* left-aligned box */
            padding: 28px;
            background-color: rgba(255, 255, 255, 0.88);
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.12);
            backdrop-filter: blur(2px);
        }
        .contact-container h1 {
            font-size: 2.1rem;
            color: #0077b6;
            margin-bottom: 10px;
        }
        .contact-container p {
            color: #555;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        /* Form styles */
        form { display: grid; grid-template-columns: 1fr; gap: 14px; }
        label { font-weight: 600; color: #495057; }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cfd8dc;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.95);
            outline: none;
            font-size: 1rem;
        }
        textarea { min-height: 140px; resize: vertical; }

        .btn-submit {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            background-color: #90e0ef; /* soft aqua */
            color: #023e8a;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.25s ease, color 0.25s ease;
            width: fit-content;
        }
        .btn-submit:hover { background-color: #48cae4; color: #fff; }

        /* Small screen tweaks */
        @media (max-width: 600px) {
            .contact-container { margin: 90px 16px 30px 16px; padding: 22px; }
        }
    </style>
</head>
<body>
    <!-- Navbar (no search bar on Contact page) -->
    <nav class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Smart Travel Logo">
            <span>Smart Travel</span>
        </div>
        <div class="nav-links">
            <a href="travel_recommendation.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </nav>

    <!-- Contact form -->
    <section class="contact-container">
        <h1>Contact Us</h1>
        <p>
            Have a question, suggestion, or need personalized travel advice?
            Send us a message and our team will get back to you as soon as possible.
        </p>

        <form action="#" method="post">
            <div>
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Your full name" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" required>
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell us how we can help..." required></textarea>
            </div>

            <button class="btn-submit" type="submit">Submit</button>
        </form>
    </section>
</body>
</html>
